# The full topology: nginx -> two app instances -> one shared Redis.
#
#   docker compose up --build --wait        # starts everything, waits for health
#   curl localhost:8080/health              # repeat: X-Served-By / "instance" alternates
#
# Only nginx (8080) and Redis (127.0.0.1:${REDIS_HOST_PORT:-6379}, loopback only) are published.
# The app containers are NOT reachable from the host: they trust X-Forwarded-For
# from the one hop in front of them (TRUST_PROXY=1), so they must only be
# reachable through nginx.

x-app: &app
  build: .
  image: scalelink:local # both instances run the same image
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  environment: &app-env
    NODE_ENV: production
    PORT: "8080"
    REDIS_URL: redis://redis:6379
    TRUST_PROXY: "1"
    BASE_URL: ${BASE_URL:-http://localhost:8080}
    RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
    RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  redis:
    image: redis:7-alpine
    # AOF with the default everysec fsync: a crash can lose up to ~1s of acknowledged writes.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379" # override if a local Redis already uses 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
