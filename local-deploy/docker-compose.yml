version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app1:
    build: ..
    environment:
      NODE_ENV: production
      TRUST_PROXY: uniquelocal
      PORT: 8080
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: app-1
      BASE_URL: http://localhost:8080
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
    depends_on:
      - redis
    restart: unless-stopped

  app2:
    build: ..
    environment:
      NODE_ENV: production
      TRUST_PROXY: uniquelocal
      PORT: 8080
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: app-2
      BASE_URL: http://localhost:8080
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
