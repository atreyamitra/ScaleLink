events {}

http {
  upstream app_servers {
    server app1:8080;
    server app2:8080;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;

      # Client identity. OVERWRITE (not append) X-Forwarded-For with the
      # address nginx itself saw, so whatever chain the client sent never
      # reaches the app. The app runs with TRUST_PROXY=1 (trust exactly this
      # one hop). Together these make a forged X-Forwarded-For useless for
      # dodging the rate limiter.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # nginx does not retry POST on another upstream by default (since 1.9.13)
      # and this config does not enable `non_idempotent`: a create that failed
      # mid-flight is never silently replayed on the other instance.
      proxy_next_upstream error timeout;
    }
  }
}
